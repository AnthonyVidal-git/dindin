[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dindin"
version = "1.0.0"
description = "Zero-dependency algorithmic trading bot: backtesting and live paper trading with a web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["trading", "backtesting", "algorithmic-trading", "paper-trading", "technical-analysis"]

[project.scripts]
dindin = "dindin.__main__:main"

[tool.setuptools]
packages = ["dindin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
